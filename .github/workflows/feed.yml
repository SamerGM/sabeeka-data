name: Price feed

# Reads official sources and seller price lists, cross-checks them and publishes the app's
# contract files to the `data` branch (single force-pushed commit; history kept in the files).
on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub may delay scheduled runs by several minutes under load
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["feed/**", ".github/workflows/feed.yml"]

permissions:
  contents: write

concurrency:
  group: price-feed
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore previous data (history)
        run: |
          mkdir -p prev
          if git fetch --depth=1 origin data 2>/dev/null; then
            git --work-tree=prev checkout FETCH_HEAD -- . || true
          fi
      - name: Run feed
        env:
          FEED_OUT: out
          FEED_PREV: prev
        run: python feed/sabeeka_feed.py
      - name: Publish to data branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp README.md out/README.md 2>/dev/null || true
          cd out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Prices $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" data
